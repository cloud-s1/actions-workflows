name: Build Image

on:
  workflow_call:
    inputs:
      images:
        required: true
        type: string
      trigger_event:
        type: string
        default: ''
      org:
        type: string
        required: true
      service_name:
        type: string
        required: true

    secrets:
      DOCKER_PASSWORD:
        required: true
      DOCKER_USERNAME:
        required: true
      CHECKOUT_TOKEN:
        required: true

jobs:
  # load_secrets:
  #   name: Load secrets from OSS
  #   uses: ./.github/workflows/_load-secrets.yml
  #   with:
  #     OSS_ENDPOINT: ${{ inputs.OSS_ENDPOINT }}
  #     OSS_BUCKET: ${{ inputs.OSS_BUCKET }}
  #     SECRETS: true
  #   secrets:
  #     ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
  #     ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}

  calculate:
    name: Calculate Tag
    if: inputs.images != '[]'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.calculate-tag.outputs.tag }}
    steps:
      - name: Calculate tag
        id: calculate-tag
        run: |
          TAG=$(echo -n '${{ github.sha }}' | sha256sum | cut -d' ' -f1 | head -c 8)
          echo "TAG=${{ github.event.number }}_$TAG" >> "$GITHUB_OUTPUT"
          echo "${{ github.event.number }}_$TAG" > image_tag.txt
      
      - name: echo tag
        run: |
          echo "build image with tag: ${{ steps.calculate-tag.outputs.tag }}"

      - name: Upload tag
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: inputs.images != '[]'
    needs: [calculate]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Checkout ${{ inputs.org }}/${{ inputs.service_name}}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.org }}/${{ inputs.service_name}}
          path: ${{ inputs.service_name}}
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Login to ACR
        id: docker-login
        # if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        run: |
          if [ -z "${{ fromJSON(inputs.images)[0].registry }}" ]; then
            echo "Registry not found in docker-image.yml, skipping"
            exit 0
          fi
          echo "${{ secrets.DOCKER_PASSWORD}}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" \
                  --password-stdin "${{ fromJSON(inputs.images)[0].registry }}"

      - uses: actions/checkout@v4

      - name: Build and push image to ACR
        working-directory: ${{ inputs.service_name }}
        run: |
          if [ -z "${{ fromJSON(inputs.images)[0].dockerfile }}" ]; then
            echo "Dockerfile not found in docker-image.yml, skipping"
            exit 0
          fi
          docker build \
            --tag "${{ fromJSON(inputs.images)[0].registry }}/${{ fromJSON(inputs.images)[0].namespace }}/${{ fromJSON(inputs.images)[0].name }}:${{ needs.calculate.outputs.image_tag }}" \
            -f ${{ fromJSON(inputs.images)[0].dockerfile }} \
            .
          docker push "${{ fromJSON(inputs.images)[0].registry }}/${{ fromJSON(inputs.images)[0].namespace }}/${{ fromJSON(inputs.images)[0].name }}:${{ needs.calculate.outputs.image_tag }}"

  scan:
    name: Scan image in ACR
    if: inputs.images != '[]'
    needs: [calculate, build-docker-image]
    runs-on: ubuntu-latest
    steps:
      - name: Scan image in ACR
        uses: aliyun/acr-scan@v1
        with:
          region-id: "${{ fromJSON(inputs.images)[0].region_id }}"
          access-key-id: "${{ secrets.ACCESS_KEY_ID }}"
          access-key-secret: "${{ secrets.ACCESS_KEY_SECRET }}"
          repository: "${{ fromJSON(inputs.images)[0].namespace }}/${{ fromJSON(inputs.images)[0].name }}"
          tag: ${{ needs.calculate.outputs.image_tag }}
