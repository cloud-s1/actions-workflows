name: Check Config
description: check docker image ymal

inputs:
  working-directory:
    description: Path to the business repo where docker-image.yml lives
    default: '.'

outputs:
  has-docker-image:
    description: Whether docker-image.yml with images key was found
    value: ${{ steps.check-exists.outputs.has-docker-image }}
  images:
    description: JSON array of images from docker-image.yml
    value: ${{ steps.parse-images.outputs.images }}
  tests:
    description: JSON array of tests from docker-image.yml
    value: ${{ steps.parse-tests.outputs.tests }}
  image-name:
    description: First image name from docker-image.yml
    value: ${{ steps.parse-image-details.outputs.name }}
  image-dockerfile:
    description: First image dockerfile from docker-image.yml
    value: ${{ steps.parse-image-details.outputs.dockerfile }}
  image-registry:
    description: First image registry from docker-image.yml
    value: ${{ steps.parse-image-details.outputs.registry }}
  image-namespace:
    description: First image namespace from docker-image.yml
    value: ${{ steps.parse-image-details.outputs.namespace }}
  image-region_id:
    description: First image region_id from docker-image.yml
    value: ${{ steps.parse-image-details.outputs.region_id }}
  test-name:
    description: First test name from docker-image.yml
    value: ${{ steps.parse-test-details.outputs.name }}
  test-dockerfile:
    description: First test dockerfile from docker-image.yml
    value: ${{ steps.parse-test-details.outputs.dockerfile }}
  test-command:
    description: First test command from docker-image.yml
    value: ${{ steps.parse-test-details.outputs.command }}

runs:
  using: composite
  steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: check docker-image.yml exists
        id: check-exists
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          if [ -f docker-image.yml ]; then
            echo "has-docker-image=true" >> "$GITHUB_OUTPUT"
            echo "docker-image.yml found"
          else
            echo "has-docker-image=false" >> "$GITHUB_OUTPUT"
            echo "docker-image.yml missing — skipping Docker jobs"
          fi

      - name: Parse images module
        id: parse-images
        if: steps.check-exists.outputs.has-docker-image == 'true'
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          if yq -e '.images | length > 0' docker-image.yml > /dev/null 2>&1; then
            echo "images=$(yq -o=json '.images' docker-image.yml | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "images=[]" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse tests module
        id: parse-tests
        if: steps.check-exists.outputs.has-docker-image == 'true'
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: |
          if yq -e '.tests | length > 0' docker-image.yml > /dev/null 2>&1; then
            echo "tests=$(yq -o=json '.tests' docker-image.yml | jq -c .)" >> "$GITHUB_OUTPUT"
          else
            echo "tests=[]" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse image details
        id: parse-image-details
        if: steps.check-exists.outputs.has-docker-image == 'true'
        shell: bash
        run: |
          echo "name=$(echo '${{ steps.parse-images.outputs.images }}' | jq -r '.[0].name // empty')" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$(echo '${{ steps.parse-images.outputs.images }}' | jq -r '.[0].dockerfile // empty')" >> "$GITHUB_OUTPUT"
          echo "registry=$(echo '${{ steps.parse-images.outputs.images }}' | jq -r '.[0].registry // empty')" >> "$GITHUB_OUTPUT"
          echo "namespace=$(echo '${{ steps.parse-images.outputs.images }}' | jq -r '.[0].namespace // empty')" >> "$GITHUB_OUTPUT"
          echo "region_id=$(echo '${{ steps.parse-images.outputs.images }}' | jq -r '.[0].region_id // empty')" >> "$GITHUB_OUTPUT"

      - name: Parse test details
        id: parse-test-details
        if: steps.check-exists.outputs.has-docker-image == 'true'
        shell: bash
        run: |
          echo "name=$(echo '${{ steps.parse-tests.outputs.tests }}' | jq -r '.[0].name // empty')" >> "$GITHUB_OUTPUT"
          echo "dockerfile=$(echo '${{ steps.parse-tests.outputs.tests }}' | jq -r '.[0].dockerfile // empty')" >> "$GITHUB_OUTPUT"
          echo "command=$(echo '${{ steps.parse-tests.outputs.tests }}' | jq -r '.[0].command // empty')" >> "$GITHUB_OUTPUT"