  get_host_ips:
    name: prepare deploy env
    runs-on: ubuntu-latest
    outputs:
      host_ips: ${{ steps.tf-outputs.outputs.ips }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Checkout s1line1/infra-live
        uses: actions/checkout@v4
        with:
          repository: s1line1/infra-live
          path: infra-live
          token: ${{ secrets.CHECKOUT_TOKEN }}
          
      # set terraform aws credentials
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::361995292965:role/github-actions-terraform-role
          aws-region: us-east-1
      
      - name: Verify AWS credentials  
        run: |
          IDENTITY=$(aws sts get-caller-identity --output json)
          ACCOUNT=$(echo "$IDENTITY" | jq -r '.Account')
          if [ "$ACCOUNT" != "361995292965" ]; then
            echo "::error::Expected account 361995292965 but got $ACCOUNT"
            exit 1
          fi
          echo "AWS credentials verified successfully"

      - name: terraform apply
        if: inputs.CLOUD == 'aws'
        working-directory: infra-live
        run: |
          cd services/${{ inputs.APP_NAME }}/${{ inputs.DEPLOY_ENV }}/aws
          terraform init
          terraform plan
          terraform apply -auto-approve
      
      - name: parse terraform outputs
        id: tf-outputs
        working-directory: infra-live/services/${{ inputs.APP_NAME }}/${{ inputs.DEPLOY_ENV }}/aws
        run: |
          IPS=$(terraform output -json instance_ip | jq -r 'to_entries | map(.value) | join(",")')
          echo "ips=$IPS" >> $GITHUB_OUTPUT


  deploy:
    name: deploy 
    # runs-on: ubuntu-latest
    needs: [get_host_ips]
    uses: s1line1/ansible-playbook/.github/workflows/CICD-ansible.yml@main
    with:
      CLOUD_TYPE: ${{ inputs.CLOUD }}
      HOST_IPS: ${{ needs.get_host_ips.outputs.host_ips }}
      APP_NAME: ${{ inputs.APP_NAME }}
    secrets:
      private_key: ${{ secrets.AWS_KEY}}
      CHECKOUT_TOKEN: ${{ secrets.CHECKOUT_TOKEN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD}}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

